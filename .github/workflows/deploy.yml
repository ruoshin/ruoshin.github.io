name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs (not tags) so an attacker who hijacks
      # the v3/v4 mutable tag can't inject code into our build. When bumping,
      # check the upstream release notes for the linked SHA and update both
      # the SHA and the trailing `# vX.Y.Z` comment.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (pinned 2026-05-19)

      - name: Install, build, and upload
        uses: withastro/action@56781b97402ce0487b7e61ce2cb960c0e2cc5289 # v3 (pinned 2026-05-19)
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4 (pinned 2026-05-19)
